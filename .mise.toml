[tools]
java = "temurin-21"
gradle = "9.7.0"

[tasks.setup]
description = "Install the declared toolchain"
run = "mise install"

[tasks.test]
description = "Run the test suite"
run = "./gradlew test"

[tasks.build]
description = "Build the project"
run = "./gradlew build"

[tasks.clean]
description = "Clean build outputs"
run = "./gradlew clean"

